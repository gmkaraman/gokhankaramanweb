<!DOCTYPE html>
<html lang="tr">
<head>
  {{ partial "head.html" . }}
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#111827">
</head>
<body class="bg-gray-100 text-gray-900">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 md:px-6">
      <div class="flex items-center justify-between py-4">
        <a href="/" class="flex items-center hover:opacity-90 transition-opacity">
          <img src="/images/header-logo.png" alt="Haber-G" class="h-10 md:h-12 w-auto">
        </a>

        <nav class="flex items-center gap-6 text-sm font-medium text-gray-700">
          <a href="/categories/" class="hover:text-blue-600 transition-colors">Kategoriler</a>
          <a href="/hakkimda/" class="hover:text-blue-600 transition-colors">Hakkımızda</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="py-6">
    {{ block "main" . }}{{ end }}
  </main>

</body>
</html>
