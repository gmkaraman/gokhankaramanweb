<!DOCTYPE html>
<html lang="tr">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-gray-100 text-gray-900">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 md:px-6">
      <div class="flex items-center justify-between py-4">
        <a href="/" class="text-xl md:text-2xl font-extrabold text-gray-900 hover:text-blue-600 transition-colors">
          Haber-G
        </a>

        <button id="menuToggle" class="md:hidden text-2xl text-gray-800 leading-none" aria-label="Menüyü aç/kapat">
          ☰
        </button>

        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-700">
          <a href="/categories/" class="hover:text-blue-600 transition-colors">Kategoriler</a>
          <a href="/search/" class="hover:text-blue-600 transition-colors">Arama</a>
          <a href="/about/" class="hover:text-blue-600 transition-colors">Hakkımızda</a>
        </nav>
      </div>

      <nav id="menuMobile" class="hidden md:hidden pb-4">
        <div class="flex flex-col gap-3 text-sm font-medium text-gray-700">
          <a href="/categories/" class="block hover:text-blue-600 transition-colors">Kategoriler</a>
          <a href="/search/" class="block hover:text-blue-600 transition-colors">Arama</a>
          <a href="/about/" class="block hover:text-blue-600 transition-colors">Hakkımızda</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="py-6">
    {{ block "main" . }}{{ end }}
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const btn = document.getElementById("menuToggle");
      const menu = document.getElementById("menuMobile");

      if (btn && menu) {
        btn.addEventListener("click", function () {
          menu.classList.toggle("hidden");
        });
      }
    });
  </script>

</body>
</html>
