<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Arama | Haber-G</title>

      <link rel="stylesheet" href="/css/main.min.45002d43033314117e0d15e26f29aaf18ab569e1f161ca293846d80f4f0a890b.css" integrity="sha256-RQAtQwMzFBF&#43;DRXibymq8Yq1aeHxYcopOEbYD08KiQs=" crossorigin="anonymous">


      <script src="/js/main.f2979a93a325fecf9605263bd141398a311c8e23388ed7dcff74f92f7e632866.js" integrity="sha256-8peak6Ml/s&#43;WBSY70UE5ijEcjiM4jtfc/3T5L35jKGY=" crossorigin="anonymous"></script>


  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#111827">
</head>
<body class="bg-gray-100 text-gray-900">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 md:px-6">
      <div class="flex items-center justify-between py-4">
        <a href="/" class="flex items-center hover:opacity-90 transition-opacity">
          <img src="/images/header-logo.png" alt="Haber-G" class="h-10 md:h-12 w-auto">
        </a>

        <nav class="flex items-center gap-6 text-sm font-medium text-gray-700">
          <a href="/categories/" class="hover:text-blue-600 transition-colors">Kategoriler</a>
          <a href="/hakkimda/" class="hover:text-blue-600 transition-colors">Hakkımızda</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="py-6">
    
<div class="search-container">
    <input type="text" id="search-input" placeholder="Search posts..." class="search-input">
    <div id="search-results" class="search-results"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

<script>

fetch('/index.json')
    .then(response => response.json())
    .then(data => {
        const options = {
            keys: [
                { name: 'title', weight: 2 },
                { name: 'content', weight: 1 },
                { name: 'tags', weight: 1.5 },
                { name: 'categories', weight: 1.5 },
                { name: 'summary', weight: 1.5 }
            ],
            threshold: 0.3,
            includeScore: true
        };
        const fuse = new Fuse(data.items, options);
        
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        
        
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('q');
        if (initialQuery) {
            searchInput.value = initialQuery;
            performSearch(initialQuery);
        }
        
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value;
            performSearch(term);
            
            const url = new URL(window.location);
            url.searchParams.set('q', term);
            window.history.pushState({}, '', url);
        });

        function performSearch(term) {
            if (term.length < 2) {
                searchResults.innerHTML = '';
                return;
            }
            
            const results = fuse.search(term);
            const html = results.map(result => {
                if (result.item.type === 'authors') {
                    return `
                        <div class="search-result author-result">
                            <h3><a href="${result.item.permalink}">${result.item.title}</a></h3>
                            <div class="author-preview">
                                <p>${result.item.summary || result.item.content.substring(0, 150)}...</p>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="search-result">
                            <h3><a href="${result.item.permalink}">${result.item.title}</a></h3>
                            <p>${result.item.summary || result.item.content.substring(0, 200)}...</p>
                        </div>
                    `;
                }
            }).join('');
            
            searchResults.innerHTML = html || '<p>No results found</p>';
        }
    });
</script>

<style>
.search-container {
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
}

.search-input {
    width: 100%;
    padding: 0.8rem;
    font-size: 1.1rem;
    border: 2px solid #ddd;
    border-radius: 4px;
    margin-bottom: 2rem;
}

.search-result {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #eee;
}

.search-result h3 {
    margin: 0 0 0.5rem 0;
}

.search-result a {
    color: #2c5282;
    text-decoration: none;
}

.search-result a:hover {
    text-decoration: underline;
}

.author-result {
    background: #f8f9fa;
    padding: 1rem;
    border-radius: 8px;
}

.author-preview {
    font-style: italic;
    color: #4a5568;
}
</style>

  </main>

</body>
</html>
